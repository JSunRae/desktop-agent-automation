name: Windows Launch Readiness

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  parent-repo-gates:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install parent repo dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run parent repo tests
      shell: pwsh
      run: python -m pytest tests

    - name: Validate launcher list
      shell: pwsh
      run: python master.py --list

    - name: Validate agent task summary
      shell: pwsh
      run: python scripts/validate_agent_tasks.py --summary

    - name: Validate dashboard and maintenance entrypoints
      shell: pwsh
      run: |
        python scripts/agent_dashboard.py --json > "$env:RUNNER_TEMP\\agent-dashboard.json"
        python scripts/workstream_dashboard.py --help
        python scripts/panel_quality_dashboard.py --help
        python scripts/health_check_panels.py --help
