[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-agent-automation"
version = "0.1.0"
description = "Desktop Agent Automation tooling and launchers"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Desktop Agent Automation" }]
dependencies = [
    "pyautogui",
    "keyboard",
    "openai",
    "pillow",
    "screeninfo",
    "uiautomation",
    "python-dotenv",
    "pyvda",
    "jsonschema",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "black>=24",
    "pylint>=3",
]

[project.scripts]
master = "automation.cli.master:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["automation*"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "-ra --strict-config --strict-markers -m \"not desktop\""
norecursedirs = [
    ".git",
    ".venv",
    "__pycache__",
    "debug",
    "logs",
    "state",
]
markers = [
    "unit: deterministic tests safe for CI and local non-interactive runs",
    "orchestration: deterministic orchestration_v1 regression gate, including tests/test_orchestration_v1_e2e.py",
    "desktop: requires a live Windows desktop, VS Code windows, or interactive UI automation",
]
